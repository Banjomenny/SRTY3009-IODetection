<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IO Detector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      width: 300px;
      background: #0f0f0f;
      color: #e5e5e5;
    }

    .popup-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
    }

    .popup-logo {
      font-size: 20px;
    }

    .popup-title {
      font-weight: bold;
      font-size: 14px;
      color: #f0f0f0;
    }

    .popup-version {
      font-size: 10px;
      color: #666;
      margin-left: auto;
    }

    .popup-section {
      padding: 12px 16px;
      border-bottom: 1px solid #1e1e1e;
    }

    .popup-section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #666;
      margin-bottom: 8px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.online { background: #16a34a; }
    .status-dot.offline { background: #dc2626; }
    .status-dot.checking {
      background: #ca8a04;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-text { color: #ccc; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat-box {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 8px;
      text-align: center;
    }

    .stat-value {
      font-size: 18px;
      font-weight: bold;
      color: #f0f0f0;
    }

    .stat-label {
      font-size: 10px;
      color: #666;
      margin-top: 2px;
    }

    .api-input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      color: #e5e5e5;
      font-family: monospace;
      font-size: 12px;
      padding: 6px 8px;
      outline: none;
    }

    .api-input:focus {
      border-color: #444;
    }

    .save-btn {
      margin-top: 8px;
      width: 100%;
      background: #1e3a5f;
      border: 1px solid #2d5a9e;
      border-radius: 4px;
      color: #93c5fd;
      font-family: monospace;
      font-size: 12px;
      padding: 6px;
      cursor: pointer;
    }

    .save-btn:hover { background: #1e40af; }

    .save-confirmation {
      font-size: 11px;
      color: #16a34a;
      text-align: center;
      margin-top: 4px;
      min-height: 16px;
    }

    .popup-footer {
      padding: 8px 16px;
      font-size: 10px;
      color: #444;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="popup-header">
    <span class="popup-logo">🔍</span>
    <span class="popup-title">IO Detector</span>
    <span class="popup-version">v1.0</span>
  </div>

  <div class="popup-section">
    <div class="popup-section-label">Backend Status</div>
    <div class="status-row">
      <div class="status-dot checking" id="statusDot"></div>
      <span class="status-text" id="statusText">Checking…</span>
    </div>
  </div>

  <div class="popup-section">
    <div class="popup-section-label">Current Page</div>
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-value" id="statScanned">—</div>
        <div class="stat-label">Scanned</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="statIO">—</div>
        <div class="stat-label">IO Flagged</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="statAvg">—</div>
        <div class="stat-label">Avg NCI</div>
      </div>
    </div>
  </div>

  <div class="popup-section">
    <div class="popup-section-label">API Endpoint</div>
    <input class="api-input" type="text" id="apiInput" placeholder="http://localhost:8000" />
    <button class="save-btn" id="saveBtn">Save</button>
    <div class="save-confirmation" id="saveConfirm"></div>
  </div>

  <div class="popup-footer">SRTY-3009 · Fanshawe College · 2026</div>

  <script src="popup.js"></script>
</body>
</html>
